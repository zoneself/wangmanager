<rect x="96" y="220" width="584" height="540" rx="14" fill="#ffffff" stroke="hsl(216 40% 40%)" stroke-opacity="0.2" stroke-width="1.5"/><rect x="96" y="220" width="584" height="76" rx="14" fill="hsl(216 55% 50%)" fill-opacity="0.08"/><rect x="96" y="282" width="584" height="4" fill="hsl(216 62% 42%)" fill-opacity="0.35"/><text x="388" y="266" fill="#2b2721" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="32" font-weight="700" text-anchor="middle">官网：给人看</text><circle cx="148" cy="330" r="5" fill="hsl(216 62% 42%)"/><text x="172" y="340" fill="#2b2721" fill-opacity="0.85" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="28">靠图片、动画撑起气派首页</text><circle cx="148" cy="396" r="5" fill="hsl(216 62% 42%)"/><text x="172" y="406" fill="#2b2721" fill-opacity="0.85" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="28">让客户觉得你靠谱愿留电话</text><circle cx="148" cy="462" r="5" fill="hsl(216 62% 42%)"/><text x="172" y="472" fill="#2b2721" fill-opacity="0.85" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="28">AI 基本不读、也读不懂</text><rect x="720" y="220" width="584" height="540" rx="14" fill="#ffffff" stroke="hsl(216 40% 40%)" stroke-opacity="0.2" stroke-width="1.5"/><rect x="720" y="220" width="584" height="76" rx="14" fill="hsl(216 55% 50%)" fill-opacity="0.08"/><rect x="720" y="282" width="584" height="4" fill="hsl(216 62% 42%)" fill-opacity="0.35"/><text x="1012" y="266" fill="#2b2721" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="32" font-weight="700" text-anchor="middle">品牌知识库：给 AI 读</text><circle cx="772" cy="330" r="5" fill="hsl(216 62% 42%)"/><text x="796" y="340" fill="#2b2721" fill-opacity="0.85" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="28">把核心事实整理成标准答案</text><circle cx="772" cy="396" r="5" fill="hsl(216 62% 42%)"/><text x="796" y="406" fill="#2b2721" fill-opacity="0.85" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="28">结构化，机器一查就懂就信</text><circle cx="772" cy="462" r="5" fill="hsl(216 62% 42%)"/><text x="796" y="472" fill="#2b2721" fill-opacity="0.85" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="28">资料越清楚，AI 越敢报你</text><text x="700" y="500" fill="hsl(216 62% 42%)" font-family="PingFang SC,Microsoft YaHei,Noto Sans SC,sans-serif" font-size="40" font-weight="700" text-anchor="middle">VS</text>
